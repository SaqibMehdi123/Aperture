[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aperture-runtime"
version = "0.3.0"
description = "Aperture - a composable, cache-aware, observable context-engineering runtime for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Saqib Mehdi", email = "saqibmehdi234@gmail.com" }]
keywords = ["llm", "agents", "context-engineering", "prompt-caching", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
litellm = [
    "litellm>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/SaqibMehdi123/Aperture"
Issues = "https://github.com/SaqibMehdi123/Aperture/issues"
Changelog = "https://github.com/SaqibMehdi123/Aperture/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["aperture", "adapters", "bench", "eval"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["aperture", "adapters", "bench", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
